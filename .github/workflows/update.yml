
name: Atualizar Dados SELIC

on:
  schedule:
    - cron: '0 12 * * 1-5'  # Roda às 12:00 UTC (11:00 BRT) em dias úteis
  workflow_dispatch:  # Permite execução manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Atualizar dados
      run: python atualizar_diariamente.py

    - name: Configurar Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Commit e Push se houver mudanças
      run: |
        if [[ -n $(git status -s) ]]; then
          BRANCH="${GITHUB_REF_NAME:-main}"
          git add .
          git commit -m "🤖 Atualização automática dos dados [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Falha ao enviar após 3 tentativas"
              exit 1
            fi

            echo "Tentativa $attempt falhou por corrida com outro push. Repetindo..."
          done
        else
          echo "Nenhuma mudança para commit"
        fi
